server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Single page application: every route (/login, /my-requests...) is answered by index.html and React Router
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The built files have a hash in their name: they can be cached
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
